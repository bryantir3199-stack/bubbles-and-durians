<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bubbles &amp; Durians</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #e8f0fa;
        --muted: #9bb4cc;
        --panel: rgba(8, 16, 28, 0.82);
        --accent: #1a8cff;
        --accent-hot: #3a9fff;
        --danger: #ff6b8a;
        --gold: #ffe566;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #071018;
        font-family: 'Fredoka', system-ui, sans-serif;
        color: var(--ink);
        user-select: none;
      }
      #game-container {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .game-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .ui-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      .ui-root button,
      .ui-root .mode-card,
      .ui-root .tab,
      .ui-root .name-field {
        pointer-events: auto;
      }

      /* Menus */
      .menu {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at center, rgba(5, 10, 24, 0.25), rgba(5, 8, 18, 0.55));
        pointer-events: auto;
      }
      .menu-card, .menu-wide {
        text-align: center;
        padding: 28px 36px;
        background: var(--panel);
        border: 2px solid rgba(255,255,255,0.85);
        border-radius: 12px;
        backdrop-filter: blur(8px);
        max-width: min(920px, 94vw);
      }
      .menu-card { width: min(440px, 92vw); }
      .logo {
        width: 160px;
        height: 160px;
        object-fit: contain;
        margin-bottom: 8px;
        filter: drop-shadow(0 8px 16px rgba(0,0,0,0.45));
        animation: floaty 2.2s ease-in-out infinite;
      }
      @keyframes floaty {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(8px); }
      }
      h1 {
        font-size: clamp(28px, 5vw, 42px);
        letter-spacing: 0.02em;
        text-shadow: 0 2px 0 #000, 0 4px 12px rgba(0,0,0,0.5);
        margin-bottom: 8px;
      }
      h1.danger { color: var(--danger); }
      .tagline, .muted { color: var(--muted); margin-bottom: 18px; font-size: 16px; }
      .score-big {
        font-size: 36px;
        color: var(--gold);
        margin: 10px 0 18px;
      }
      .btn {
        display: block;
        width: 100%;
        margin: 10px auto 0;
        max-width: 280px;
        padding: 12px 18px;
        font: 700 22px 'Fredoka', sans-serif;
        color: #fff;
        background: #445566;
        border: 2px solid #fff;
        border-radius: 8px;
        cursor: pointer;
      }
      .btn.primary { background: var(--accent); }
      .btn.primary:hover { background: var(--accent-hot); }
      .btn.muted-btn { max-width: 180px; margin-top: 16px; }
      .btn-row {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-top: 8px;
      }
      .btn-row .btn { width: 160px; margin: 0; }

      .mode-row {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        margin: 18px 0 8px;
      }
      .mode-card {
        width: min(340px, 86vw);
        min-height: 260px;
        padding: 24px 18px;
        background: rgba(18, 38, 58, 0.92);
        border: 3px solid #fff;
        border-radius: 10px;
        color: inherit;
        font: inherit;
        cursor: pointer;
        text-align: center;
      }
      .mode-card:hover { background: rgba(26, 58, 92, 0.95); }
      .mode-card h2 { font-size: 32px; color: #7ec8ff; margin-bottom: 14px; }
      .mode-card.timed h2 { color: var(--gold); }
      .mode-card p { color: #d0e4f7; font-size: 16px; line-height: 1.55; }

      .progress {
        width: 280px;
        height: 14px;
        margin: 16px auto;
        background: #333;
        border-radius: 8px;
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        width: 0;
        background: var(--accent);
        transition: width 0.2s ease;
      }

      .tabs { display: flex; gap: 12px; justify-content: center; margin: 12px 0 18px; }
      .tab {
        padding: 10px 28px;
        font: 700 18px 'Fredoka', sans-serif;
        color: #fff;
        background: #334455;
        border: 2px solid #fff;
        border-radius: 8px;
        cursor: pointer;
      }
      .tab.active { background: var(--accent); }
      .lb-panel {
        width: min(520px, 88vw);
        margin: 0 auto;
        padding: 18px 16px 24px;
        background: rgba(10, 22, 40, 0.9);
        border: 2px solid #fff;
        border-radius: 10px;
        min-height: 360px;
      }
      .lb-list { font-family: 'Fredoka', monospace; text-align: left; padding: 8px 20px; }
      .lb-header { color: #7ec8ff; margin-bottom: 10px; white-space: pre; }
      .lb-row { font-size: 20px; margin: 6px 0; white-space: pre; }
      .lb-row.gold { color: var(--gold); }
      .warn-text { color: #ffaa66; text-align: center; line-height: 1.5; }
      .danger-text { color: var(--danger); }
      .ok-text { color: #7cff7c; }
      .name-field {
        width: 280px;
        margin: 10px auto;
        padding: 10px;
        background: #1a3a5c;
        border: 2px solid #fff;
        border-radius: 8px;
        font-size: 24px;
        cursor: text;
      }
      .status { min-height: 22px; color: #ffaa66; font-size: 15px; margin-bottom: 8px; }

      /* Cartoon HUD dock */
      .hud { position: absolute; inset: 0; pointer-events: none; }
      .hud-dock {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
        padding: 0 clamp(10px, 2.5vw, 28px) 10px;
        z-index: 12;
        pointer-events: none;
      }
      .hud-left,
      .hud-right,
      .hud-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
      }
      .hud-left { align-items: flex-start; min-width: 0; }
      .hud-right { align-items: flex-end; min-width: 0; }
      .hud-center { flex: 0 1 auto; }

      .hud-panel {
        position: relative;
        filter: drop-shadow(0 6px 0 rgba(0, 0, 0, 0.35));
      }
      .hud-panel-base {
        position: absolute;
        inset: 6px 0 -7px 0;
        border-radius: 999px;
        z-index: 0;
      }
      .hud-panel-body {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        min-height: 58px;
        padding: 8px 18px 10px;
        border-radius: 999px;
        border: 3px solid rgba(40, 18, 28, 0.85);
        box-shadow:
          inset 0 3px 0 rgba(255, 255, 255, 0.35),
          inset 0 -4px 0 rgba(0, 0, 0, 0.12);
      }
      .hud-panel-label {
        position: absolute;
        top: -14px;
        font: 700 13px/1 'Fredoka', sans-serif;
        letter-spacing: 0.06em;
        color: #fff;
        -webkit-text-stroke: 3px #1a1018;
        paint-order: stroke fill;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
        pointer-events: none;
      }

      /* SCORE */
      .hud-score .hud-panel-base {
        background: linear-gradient(#7a1230, #4a0c1e);
        border-radius: 40px 999px 999px 40px;
      }
      .hud-score .hud-panel-body {
        min-width: 150px;
        background: linear-gradient(180deg, #ff6b8f 0%, #e8335a 55%, #c91f45 100%);
        border-radius: 28px 999px 999px 40px;
        padding-left: 16px;
        padding-right: 12px;
        justify-content: flex-end;
      }
      .hud-score .hud-panel-label { left: 18px; top: -12px; }
      .hud-score-value {
        display: grid;
        place-items: center;
        min-width: 54px;
        min-height: 54px;
        padding: 4px 10px;
        background: radial-gradient(circle at 35% 30%, #fff, #f3f3f3 70%);
        border: 3.5px solid #1a1018;
        border-radius: 50%;
        box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12);
      }
      .hud-score-num {
        font: 700 clamp(22px, 4vw, 30px)/1 'Fredoka', sans-serif;
        color: #1a1018;
        letter-spacing: -0.02em;
      }

      /* COMBO ribbon */
      .hud-combo {
        position: absolute;
        left: 8px;
        bottom: calc(100% + 6px);
        transform: rotate(-8deg);
        transform-origin: left bottom;
        padding: 7px 16px 8px;
        background: linear-gradient(180deg, #ffe566 0%, #ffc107 55%, #ff9800 100%);
        border: 3px solid #c62828;
        border-radius: 8px;
        box-shadow:
          0 4px 0 #8b1a1a,
          inset 0 2px 0 rgba(255, 255, 255, 0.45);
        z-index: 2;
      }
      .hud-combo[hidden] { display: none !important; }
      .hud-combo-text {
        font: 700 18px/1 'Fredoka', sans-serif;
        font-style: italic;
        color: #e53935;
        letter-spacing: 0.04em;
        -webkit-text-stroke: 2.5px #1a1018;
        paint-order: stroke fill;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
        white-space: nowrap;
      }
      .hud-combo.max .hud-combo-text { color: #ff1744; }
      .hud-combo.pop { animation: comboPop 0.35s cubic-bezier(0.2, 1.4, 0.4, 1); }
      @keyframes comboPop {
        0% { transform: rotate(-8deg) scale(0.7); }
        60% { transform: rotate(-8deg) scale(1.12); }
        100% { transform: rotate(-8deg) scale(1); }
      }

      /* AMMO */
      .hud-ammo .hud-panel-base {
        background: linear-gradient(#8a4a12, #5a2e08);
      }
      .hud-ammo .hud-panel-body {
        min-width: min(340px, 52vw);
        background: linear-gradient(180deg, #ffd27a 0%, #ffb03a 45%, #f08a1a 100%);
        border-radius: 999px;
        justify-content: center;
        padding: 14px 22px 12px;
        padding-top: 18px;
      }
      .hud-ammo .hud-panel-label {
        left: 50%;
        top: -16px;
        transform: translateX(-50%);
        background: linear-gradient(180deg, #ffd27a, #ffb03a);
        border: 3px solid rgba(40, 18, 28, 0.85);
        border-radius: 999px;
        padding: 5px 14px 4px;
        box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35);
        -webkit-text-stroke: 2.5px #1a1018;
      }
      .hud-ammo-icons {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        min-height: 40px;
      }
      .hud-tooth {
        display: grid;
        place-items: center;
        width: clamp(28px, 4.2vw, 38px);
        height: clamp(28px, 4.2vw, 38px);
        transition: transform 0.15s ease, opacity 0.15s ease, filter 0.15s ease;
      }
      .hud-tooth-icon { width: 100%; height: 100%; display: block; overflow: visible; }
      .hud-tooth.empty {
        opacity: 0.28;
        filter: grayscale(0.7);
        transform: scale(0.88);
      }
      .hud-tooth.filled { animation: toothIn 0.22s ease; }
      @keyframes toothIn {
        from { transform: scale(0.6); }
        to { transform: scale(1); }
      }
      .hud-ammo.empty .hud-panel-body,
      .hud-ammo.warn .hud-panel-body {
        background: linear-gradient(180deg, #ff9a7a 0%, #ff5a3a 55%, #d62818 100%);
      }
      .hud-ammo.reloading .hud-ammo-icons { animation: ammoPulse 0.45s ease-in-out infinite; }
      .hud-ammo.flash { animation: blink 0.08s linear 3; }
      @keyframes ammoPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      @keyframes blink { 50% { opacity: 0.3; } }

      /* TIME */
      .hud-time .hud-panel-base {
        background: linear-gradient(#4a1a6a, #2a0c42);
        border-radius: 999px 40px 40px 999px;
      }
      .hud-time .hud-panel-body {
        min-width: 150px;
        background: linear-gradient(180deg, #d4a0ff 0%, #b06cff 45%, #8a3de0 100%);
        border-radius: 999px 28px 40px 999px;
        justify-content: flex-start;
        padding-left: 16px;
        padding-right: 18px;
      }
      .hud-time .hud-panel-label { right: 18px; top: -12px; left: auto; }
      .hud-time-value {
        display: flex;
        align-items: baseline;
        gap: 6px;
        color: #fff;
        -webkit-text-stroke: 3.5px #1a1018;
        paint-order: stroke fill;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
      }
      .hud-time-min {
        font: 700 clamp(28px, 5vw, 36px)/1 'Fredoka', sans-serif;
      }
      .hud-time-sec {
        font: 700 clamp(18px, 3.2vw, 24px)/1 'Fredoka', sans-serif;
        opacity: 0.95;
      }
      .hud-time.critical .hud-panel-body {
        background: linear-gradient(180deg, #ff8a9a 0%, #ff4466 55%, #c81840 100%);
        animation: criticalPulse 0.6s ease-in-out infinite;
      }
      @keyframes criticalPulse {
        0%, 100% { filter: brightness(1); }
        50% { filter: brightness(1.15); }
      }

      /* LIVES (endless) */
      .hud-lives .hud-panel-base {
        background: linear-gradient(#7a1230, #4a0c1e);
        border-radius: 999px 40px 40px 999px;
      }
      .hud-lives .hud-panel-body {
        min-width: 150px;
        background: linear-gradient(180deg, #ff8aab 0%, #ff4d7a 50%, #e02555 100%);
        border-radius: 999px 28px 40px 999px;
        justify-content: flex-start;
        padding-left: 16px;
        padding-right: 18px;
      }
      .hud-lives .hud-panel-label { right: 18px; top: -12px; left: auto; }
      .hud-lives-value {
        display: flex;
        align-items: center;
        gap: 2px;
        font-size: clamp(22px, 4vw, 28px);
        line-height: 1;
      }
      .hud-heart {
        color: #fff;
        -webkit-text-stroke: 2.5px #1a1018;
        paint-order: stroke fill;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
      }
      .hud-heart.empty { color: #ffe0ea; font-size: 0.9em; }
      .hud-lives.critical .hud-panel-body {
        animation: criticalPulse 0.6s ease-in-out infinite;
      }

      .hud-reload-btn {
        margin-top: 8px;
        padding: 8px 18px;
        font: 700 16px 'Fredoka', sans-serif;
        color: #fff;
        background: linear-gradient(180deg, #5ab0ff, #1a8cff);
        border: 3px solid #1a1018;
        border-radius: 999px;
        box-shadow: 0 4px 0 #0a3a6a, inset 0 2px 0 rgba(255, 255, 255, 0.35);
        cursor: pointer;
        pointer-events: auto;
        letter-spacing: 0.04em;
      }
      .hud-reload-btn:hover { filter: brightness(1.08); }
      .hud-reload-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #0a3a6a; }
      .hud-reload-hint {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 48px;
        font-weight: 700;
        color: #ff4444;
        text-shadow: 0 0 6px #000, 3px 3px 0 #000;
        animation: reloadFlash 0.55s ease-in-out infinite;
        z-index: 15;
        pointer-events: none;
      }
      .hud-reload-hint[hidden] {
        display: none !important;
        animation: none;
      }
      @keyframes reloadFlash {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      body.playing { cursor: none; }
      .crosshair {
        position: fixed;
        top: 0; left: 0;
        width: 56px;
        height: 56px;
        border: none;
        border-radius: 0;
        pointer-events: none;
        box-shadow: none;
        background: url('/assets/reticle.png') center / contain no-repeat;
        transform: translate(var(--x, 0px), var(--y, 0px)) translate(-50%, -50%);
      }
      .crosshair::before, .crosshair::after { content: none; }
      .crosshair.kick {
        animation: crosshairKick 0.16s ease-out;
      }
      @keyframes crosshairKick {
        0% { transform: translate(var(--x, 0px), var(--y, 0px)) translate(-50%, -50%) scale(1); }
        35% { transform: translate(var(--x, 0px), var(--y, 0px)) translate(-50%, -50%) scale(0.5); }
        100% { transform: translate(var(--x, 0px), var(--y, 0px)) translate(-50%, -50%) scale(1); }
      }
      .crumb {
        position: fixed;
        width: var(--s, 12px);
        height: var(--s, 10px);
        margin: 0;
        left: 0;
        top: 0;
        border-radius: 40% 55% 45% 60%;
        pointer-events: none;
        z-index: 18;
        background: var(--c, #d8b07a);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25);
        opacity: 1;
        transform: translate(-50%, -50%) translate(0, 0) rotate(0deg);
        animation: crumbFall var(--dur, 0.55s) cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
      }
      @keyframes crumbFall {
        0% {
          opacity: 1;
          transform: translate(-50%, -50%) translate(0, 0) rotate(0deg) scale(1);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -50%)
            translate(var(--dx, 0px), var(--dy, 40px))
            rotate(var(--rot, 180deg))
            scale(0.6);
        }
      }
      .bubble-pop-flash {
        position: fixed;
        left: 0;
        top: 0;
        width: 34px;
        height: 34px;
        margin: 0;
        border-radius: 50%;
        pointer-events: none;
        z-index: 40;
        background: radial-gradient(circle, #fff 0%, #7ad7ff 45%, transparent 72%);
        transform: translate(-50%, -50%) scale(0.4);
        animation: bubblePopFlash 0.26s ease-out forwards;
      }
      @keyframes bubblePopFlash {
        0% { opacity: 1; transform: translate(-50%, -50%) scale(0.4); }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(2.8); }
      }
      .bubble-pop-ring {
        position: fixed;
        left: 0;
        top: 0;
        width: 28px;
        height: 28px;
        margin: 0;
        border-radius: 50%;
        border: 3px solid #ff4d8d;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.85), 0 0 14px rgba(46, 199, 255, 0.9);
        pointer-events: none;
        z-index: 40;
        transform: translate(-50%, -50%) scale(0.3);
        animation: bubblePopRing 0.45s cubic-bezier(0.15, 0.75, 0.35, 1) forwards;
      }
      @keyframes bubblePopRing {
        0% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(0.3);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(4.2);
        }
      }
      .bubble-pop {
        position: fixed;
        width: var(--s, 14px);
        height: var(--s, 14px);
        margin: 0;
        left: 0;
        top: 0;
        border-radius: 50%;
        pointer-events: none;
        z-index: 40;
        background: var(--c, #2ec7ff);
        box-shadow: 0 0 0 2px #fff, 0 2px 0 #000;
        opacity: 1;
        transform: translate(-50%, -50%) translate(0, 0) scale(1);
        animation: bubblePopBurst var(--dur, 0.55s) cubic-bezier(0.12, 0.7, 0.28, 1) forwards;
      }
      @keyframes bubblePopBurst {
        0% {
          opacity: 1;
          transform: translate(-50%, -50%) translate(0, 0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -50%)
            translate(var(--dx, 0px), var(--dy, 0px))
            scale(0.35);
        }
      }
      .floater {
        position: fixed;
        transform: translate(-50%, -50%);
        font-size: 28px;
        font-weight: 700;
        text-shadow: 0 2px 0 #000, 0 0 6px #000;
        pointer-events: none;
        transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.7s ease;
        opacity: 1;
        z-index: 20;
      }
      .floater.go {
        transform: translate(-50%, calc(-50% - 60px));
        opacity: 0;
      }

      @media (max-width: 700px) {
        .hud-dock {
          flex-wrap: wrap;
          justify-content: center;
          gap: 8px;
          padding-bottom: 8px;
        }
        .hud-left, .hud-right { order: 2; }
        .hud-center { order: 1; width: 100%; }
        .hud-score .hud-panel-body,
        .hud-time .hud-panel-body,
        .hud-lives .hud-panel-body { min-width: 120px; min-height: 48px; padding: 6px 12px 8px; }
        .hud-ammo .hud-panel-body { min-width: 0; width: 100%; padding: 14px 12px 10px; }
        .hud-combo-text { font-size: 15px; }
        .hud-reload-btn { font-size: 14px; padding: 6px 12px; }
        .hud-panel-label { font-size: 11px; }
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
