<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bubbles &amp; Durians" />
    <meta name="theme-color" content="#071018" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/logo.png" />
    <title>Bubbles &amp; Durians</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #e8f0fa;
        --muted: #9bb4cc;
        --panel: rgba(8, 16, 28, 0.82);
        --accent: #1a8cff;
        --accent-hot: #3a9fff;
        --danger: #ff6b8a;
        --gold: #ffe566;
        --title-serif: 'Baloo 2', 'Fredoka', system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        position: fixed;
        inset: 0;
        background: #071018;
        font-family: 'Fredoka', system-ui, sans-serif;
        color: var(--ink);
        user-select: none;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      #game-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .game-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      .ui-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      .screen-fade {
        position: absolute;
        inset: 0;
        background: #f5f5f5;
        opacity: 0;
        pointer-events: none;
        z-index: 80;
        transition: opacity 0.5s ease;
      }
      .screen-fade.is-black {
        background: #000;
      }
      .screen-fade.is-on {
        opacity: 1;
        pointer-events: auto;
      }

      /* Post-run RESULTS plaque — split halves slam together over the stage. */
      .results-crash {
        position: absolute;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        overflow: hidden;
        opacity: 0;
        background-color: #5b3710;
      }
      .results-crash.is-playing {
        z-index: 15;
        opacity: 1;
      }
      .results-crash.is-held {
        z-index: 5;
        opacity: 1;
      }
      /* Image has extra gold margins; hang them off-screen without cropping the figures. */
      .results-crash-bleed {
        position: absolute;
        inset: -10%;
        will-change: transform;
      }
      .results-crash-pane {
        position: absolute;
        inset: 0;
        background-color: #5b3710;
        background-image: url('/assets/results-plaque.jpg');
        background-size: cover;
        background-position: 50% 28%;
        background-repeat: no-repeat;
        transform-origin: 50% 50%;
        will-change: transform;
      }
      /* Narrow/short mobile viewports crop the flag & faces under "cover" — shrink to fit instead.
         Drop the bleed inset too, since it inflates the box "contain" sizes against. */
      html.touch-ui .results-crash-bleed {
        inset: 0;
      }
      html.touch-ui .results-crash-pane {
        background-size: contain;
      }
      .results-crash-top {
        clip-path: inset(0 0 48% 0);
        transform: translateY(-55%);
      }
      .results-crash-bottom {
        clip-path: inset(48% 0 0 0);
        transform: translateY(55%);
      }
      .results-crash.is-slam .results-crash-top {
        animation: resultsSlamTop 0.32s cubic-bezier(0.12, 0.7, 0.18, 1) forwards;
      }
      .results-crash.is-slam .results-crash-bottom {
        animation: resultsSlamBottom 0.32s cubic-bezier(0.12, 0.7, 0.18, 1) forwards;
      }
      .results-crash.is-held .results-crash-top,
      .results-crash.is-held .results-crash-bottom {
        transform: none;
        animation: none;
      }
      @keyframes resultsSlamTop {
        0% { transform: translateY(-55%); }
        72% { transform: translateY(5%) scale(1.08); }
        86% { transform: translateY(-2%) scale(1.03); }
        100% { transform: none; }
      }
      @keyframes resultsSlamBottom {
        0% { transform: translateY(55%); }
        72% { transform: translateY(-5%) scale(1.08); }
        86% { transform: translateY(2%) scale(1.03); }
        100% { transform: none; }
      }
      .results-crash.is-hit .results-crash-bleed {
        animation: resultsCrashShake 0.38s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      }
      @keyframes resultsCrashShake {
        0%, 100% { transform: translate(0, 0); }
        10% { transform: translate(-16px, 10px); }
        22% { transform: translate(18px, -8px); }
        34% { transform: translate(-12px, -6px); }
        48% { transform: translate(10px, 7px); }
        62% { transform: translate(-6px, 3px); }
        76% { transform: translate(4px, -2px); }
        88% { transform: translate(-2px, 1px); }
      }
      .results-crash-flash {
        position: absolute;
        left: -8%;
        right: -8%;
        top: 50%;
        height: 28px;
        margin-top: -14px;
        background: linear-gradient(
          to bottom,
          transparent 0%,
          rgba(255, 244, 200, 0.55) 35%,
          #fff 50%,
          rgba(255, 244, 200, 0.55) 65%,
          transparent 100%
        );
        opacity: 0;
        transform: scaleY(0.2);
        pointer-events: none;
      }
      .results-crash.is-hit .results-crash-flash {
        animation: resultsSeamFlash 0.28s ease-out;
      }
      @keyframes resultsSeamFlash {
        0% { opacity: 1; transform: scaleY(3.2); }
        100% { opacity: 0; transform: scaleY(0.15); }
      }
      html.touch-ui .results-crash-pane {
        background-image: url('/assets/results-plaque-mobile.jpg');
      }
      html.touch-ui .results-crash-bleed {
        inset: 0;
      }
      @media (orientation: portrait) {
        html.touch-ui .results-crash-pane {
          background-size: 185% auto;
          background-position: 50% 0;
          background-repeat: no-repeat;
        }
        html.touch-ui body.results-crash-on .menu.bonus-tally,
        html.touch-ui body.results-crash-on .menu.game-over,
        html.touch-ui body.results-crash-on .menu.leaderboard {
          justify-content: flex-end;
        }
        html.touch-ui body.results-crash-on .menu.bonus-tally .menu-card,
        html.touch-ui body.results-crash-on .menu.game-over .menu-card,
        html.touch-ui body.results-crash-on .menu.leaderboard .menu-wide {
          margin-block: 0 8px;
        }
      }
      body.results-crash-on .menu.bonus-tally,
      body.results-crash-on .menu.game-over,
      body.results-crash-on .menu.leaderboard {
        background: transparent;
      }
      body.results-crash-on .menu.bonus-tally h1.danger {
        display: none;
      }
      body.results-crash-on .menu.bonus-tally .muted {
        margin-bottom: 10px;
      }
      .ui-root button,
      .ui-root .mode-card,
      .ui-root .menu-tile,
      .ui-root .menu-option,
      .ui-root .tab,
      .ui-root .name-field,
      .ui-root .title-splash,
      .ui-root .hud-ammo,
      .ui-root .hud-ctrl,
      .ui-root .hud-reload-btn,
      .ui-root .tut-speaker,
      .ui-root .tut-bubble,
      .ui-root .tut-btn {
        pointer-events: auto;
      }

      /* Menus */
      .menu {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at center, rgba(5, 10, 24, 0.25), rgba(5, 8, 18, 0.55));
        pointer-events: auto;
      }
      .options-menu-host {
        position: absolute;
        inset: 0;
      }
      .menu.title-splash {
        position: absolute;
        inset: 0;
        background: #fff800;
        cursor: pointer;
      }
      .menu.main-menu {
        --menu-pattern-size: 270px;
        --menu-btn-face: #aee54d;
        --spike-fill: #c0f25f;
        position: relative;
        overflow: hidden;
        cursor: default;
        background-color: #2a82d0;
        background-image:
          repeating-linear-gradient(
            to bottom,
            transparent 0 6px,
            rgba(12, 48, 96, 0.16) 6px 11px
          ),
          linear-gradient(to bottom, #58a8e4 0%, #1762ad 100%);
      }
      .menu.main-menu::before {
        content: '';
        position: absolute;
        inset: -45%;
        background-image: url('/assets/menu-pattern.png');
        background-repeat: repeat;
        background-size: var(--menu-pattern-size) var(--menu-pattern-size);
        opacity: 0.48;
        pointer-events: none;
        z-index: 0;
        contain: paint;
        animation: menuPatternScroll 44s linear infinite;
      }
      .menu.main-menu > * {
        position: relative;
        z-index: 1;
      }
      @keyframes menuPatternScroll {
        from { transform: rotate(-28deg) translate3d(0, 0, 0); }
        to { transform: rotate(-28deg) translate3d(calc(var(--menu-pattern-size) * -1), calc(var(--menu-pattern-size) * -1), 0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .menu.main-menu::before {
          animation: none;
        }
      }
      .menu.main-menu:has(.main-menu-home) {
        --menu-gap: clamp(28px, 3.2vmin, 52px);
        --menu-pad: clamp(40px, 6.8vmin, 96px);
        align-items: stretch;
        justify-content: stretch;
        padding:
          max(var(--menu-pad), env(safe-area-inset-top, 0px))
          max(var(--menu-pad), env(safe-area-inset-right, 0px))
          max(var(--menu-pad), env(safe-area-inset-bottom, 0px))
          max(var(--menu-pad), env(safe-area-inset-left, 0px));
      }
      .title-splash-content,
      .main-menu-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        width: min(720px, 92vw);
        padding: 24px 16px;
        animation: none;
      }
      .title-splash-content {
        width: 100%;
        padding: 24px 0;
      }
      .title-logo,
      .main-menu-logo {
        width: min(420px, 72vw);
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.55));
        animation: logoFloat 3.2s ease-in-out infinite;
        pointer-events: none;
      }
      .title-logo {
        width: 50vw;
        max-width: none;
        max-height: none;
        filter: none;
        animation: none;
      }
      .main-menu-logo {
        width: min(280px, 52vw);
        margin-bottom: 28px;
      }
      .click-anywhere {
        margin-top: 12px;
        font: 800 clamp(22px, 4.2vw, 36px) / 1.15 'Baloo 2', 'Fredoka', sans-serif;
        letter-spacing: 0.12em;
        color: #000;
        animation: clickBlink 1.2s steps(1, end) infinite;
        pointer-events: none;
      }
      .click-anywhere .prompt-tap { display: none; }
      html.touch-ui .click-anywhere .prompt-click { display: none; }
      html.touch-ui .click-anywhere .prompt-tap { display: inline; }
      @media (hover: none) and (pointer: coarse) {
        .click-anywhere .prompt-click { display: none; }
        .click-anywhere .prompt-tap { display: inline; }
      }
      .high-score-banner {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 2;
        margin: 0;
        padding: max(14px, env(safe-area-inset-top, 0px)) 20px 8px;
        font: 800 clamp(15px, 2.4vw, 20px) / 1.2 'Baloo 2', 'Fredoka', sans-serif;
        letter-spacing: 0.06em;
        color: #fff;
        -webkit-text-stroke: 2px #1a1018;
        paint-order: stroke fill;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        pointer-events: none;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
      }
      .high-score-banner[hidden] {
        display: none;
      }
      .high-score-rotator {
        transition: opacity 0.14s ease;
      }
      .high-score-rotator.is-swap {
        opacity: 0;
      }
      .high-score-label,
      .high-score-name,
      .high-score-value,
      .high-score-mode {
        font: inherit;
      }
      .high-score-mode {
        margin-right: 0.2em;
      }
      .high-score-label {
        font-weight: 800;
      }
      .high-score-banner .high-score-name {
        color: #fff;
      }
      .high-score-banner .high-score-value {
        color: var(--gold);
      }
      .main-menu-home {
        width: 100%;
        height: 100%;
        max-width: none;
        padding: 0;
        justify-content: stretch;
        gap: 0;
      }
      .main-menu-layout {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: var(--menu-gap, 32px);
      }
      .main-menu-modes {
        flex: 1.85 1 0;
        min-height: 0;
        display: grid;
        grid-template-columns: 1.08fr 1fr;
        gap: var(--menu-gap, 32px);
      }
      .main-menu-timed {
        display: flex;
        flex-direction: column;
        gap: var(--menu-gap, 32px);
        min-height: 0;
      }
      .main-menu-timed .menu-tile {
        flex: 1 1 0;
      }
      .main-menu-utils {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: var(--menu-gap, 32px);
        flex: 0.52 1 0;
        min-height: 0;
      }
      .menu-tile {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        min-height: 0;
        padding: 22px 20px;
        font: 800 clamp(20px, 3.6vw, 42px) / 1.05 'Baloo 2', 'Fredoka', sans-serif;
        letter-spacing: 0.04em;
        color: #fff;
        -webkit-text-stroke: 3px #1a1018;
        paint-order: stroke fill;
        text-shadow: 0 3px 0 rgba(0, 0, 0, 0.28);
        background-color: transparent;
        background-clip: border-box;
        --menu-btn-border: clamp(22px, 4vmin, 48px);
        border: var(--menu-btn-border) solid transparent;
        border-image: none;
        border-radius: 0;
        overflow: visible;
        box-shadow: none;
        cursor: pointer;
        position: relative;
        isolation: isolate;
        z-index: 0;
        filter: none;
        transform: translateZ(0);
        transition: transform 0.12s ease, filter 0.06s ease;
      }
      .menu-btn-skin {
        position: absolute;
        inset: calc(-1 * var(--menu-btn-border));
        z-index: 1;
        pointer-events: none;
        display: block;
      }
      .menu-btn-skin canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }
      /* Face color under the 9-slice so subpixel slice gaps stay lime, not the page background. */
      .menu-tile::before,
      .menu.main-menu .menu-option::before {
        content: '';
        position: absolute;
        inset: -6px;
        border-radius: calc(var(--menu-btn-border) * 0.65);
        background: var(--menu-btn-face);
        z-index: 0;
        pointer-events: none;
      }
      .menu-zigzag {
        /* Corner 98×63 cropped at tooth valleys; triangles scale to the 37px tooth. */
        --zig-ch: clamp(14px, 2.6vmin, 26px);
        --zig-cw: calc(var(--zig-ch) * 98 / 63);
        --zig-th: calc(var(--zig-ch) * 37 / 63);
        --zig-sw: calc(var(--zig-ch) * 37 / 63);
        position: absolute;
        inset: clamp(6px, 1.2vmin, 12px);
        z-index: 2;
        pointer-events: none;
      }
      .menu-zig-fill {
        position: absolute;
        top: var(--zig-th);
        right: var(--zig-sw);
        bottom: var(--zig-th);
        left: var(--zig-sw);
        background-color: var(--spike-fill);
      }
      .menu-zig-t,
      .menu-zig-b,
      .menu-zig-l,
      .menu-zig-r,
      .menu-zig-tl,
      .menu-zig-tr,
      .menu-zig-bl,
      .menu-zig-br {
        position: absolute;
        background-repeat: no-repeat;
      }
      .menu-zig-t,
      .menu-zig-b {
        left: calc(var(--zig-cw) - 1px);
        right: calc(var(--zig-cw) - 1px);
        height: var(--zig-th);
        background-image: url('/assets/zig-top.png');
        background-repeat: repeat-x;
        background-size: auto 100%;
        background-position: left top;
      }
      .menu-zig-t { top: 0; }
      .menu-zig-b {
        bottom: 0;
        transform: scaleY(-1);
      }
      .menu-zig-l,
      .menu-zig-r {
        top: calc(var(--zig-ch) - 1px);
        bottom: calc(var(--zig-ch) - 1px);
        width: var(--zig-sw);
        background-image: url('/assets/zig-side.png');
        background-repeat: repeat-y;
        background-size: 100% auto;
        background-position: left top;
      }
      .menu-zig-l { left: 0; }
      .menu-zig-r {
        right: 0;
        transform: scaleX(-1);
      }
      .menu-zig-tl,
      .menu-zig-tr,
      .menu-zig-bl,
      .menu-zig-br {
        width: var(--zig-cw);
        height: var(--zig-ch);
        background-image: url('/assets/zig-corner.png');
        background-size: 100% 100%;
        z-index: 1;
      }
      .menu-zig-tl { top: 0; left: 0; }
      .menu-zig-tr {
        top: 0;
        right: 0;
        transform: scaleX(-1);
      }
      .menu-zig-bl {
        bottom: 0;
        left: 0;
        transform: scaleY(-1);
      }
      .menu-zig-br {
        bottom: 0;
        right: 0;
        transform: scale(-1);
      }
      .menu-btn-label {
        position: relative;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .menu-icon {
        display: block;
        object-fit: contain;
        pointer-events: none;
        flex-shrink: 0;
      }
      .menu-tile.endless,
      .menu-tile.timed {
        gap: 0;
      }
      .menu-icon-mode {
        position: relative;
        width: auto;
        height: 1.5em;
        margin-bottom: -0.72em;
        transform: translateY(-0.08em);
        z-index: 2;
        pointer-events: none;
      }
      .menu-tile:not(.util) .menu-btn-label {
        transform: translateY(0.12em);
        z-index: 3;
      }
      .menu-tile.util .menu-btn-label {
        flex-direction: row;
        justify-content: center;
        align-items: center;
        column-gap: 0.4em;
      }
      .menu-icon-util {
        height: 1em;
        width: auto;
      }
      .menu-tile.is-selecting {
        animation: menuTileSelectFlash 0.75s steps(1, end) forwards;
        pointer-events: none;
      }
      @keyframes menuTileSelectFlash {
        0% { opacity: 0; }
        16.666% { opacity: 1; }
        33.333% { opacity: 0; }
        50% { opacity: 1; }
        66.666% { opacity: 0; }
        83.333% { opacity: 1; }
        100% { opacity: 1; }
      }
      .menu-tile:hover,
      .menu-tile:focus-visible {
        filter: brightness(1.09);
        outline: none;
      }
      .menu-tile:hover {
        transform: translateZ(0) scale(0.95);
      }
      .menu-tile:active {
        transform: translateZ(0) scale(0.95) translateY(4px);
        filter: brightness(0.92);
      }
      .menu-tile.util {
        --util-hue: -28deg;
        min-height: 0;
        padding: 10px 12px;
        --menu-btn-border: clamp(14px, 2.6vmin, 28px);
        border-width: var(--menu-btn-border);
        font-size: clamp(16px, 2.6vw, 32px);
        filter: hue-rotate(var(--util-hue));
      }
      .menu-tile.util .menu-icon,
      .menu-tile.util .menu-btn-label {
        filter: hue-rotate(calc(-1 * var(--util-hue)));
      }
      .menu-tile.util:hover,
      .menu-tile.util:focus-visible {
        filter: hue-rotate(var(--util-hue)) brightness(1.09);
      }
      .menu-tile.util:active {
        filter: hue-rotate(var(--util-hue)) brightness(0.92);
      }
      .menu-tile.endless {
        font-size: clamp(28px, 4.8vw, 56px);
      }
      .menu-tile.util .menu-zigzag {
        inset: 5px;
        --zig-ch: 12px;
      }
      .menu.main-menu .menu-option .menu-zigzag {
        inset: 4px;
        --zig-ch: 11px;
      }
      .main-menu-nav {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 14px;
        width: min(380px, 86vw);
      }
      .menu.main-menu .menu-option {
        display: block;
        width: 100%;
        padding: 14px 20px;
        font: 800 clamp(18px, 3.2vw, 24px) / 1.2 'Baloo 2', 'Fredoka', sans-serif;
        letter-spacing: 0.06em;
        color: #fff;
        -webkit-text-stroke: 3px #1a1018;
        paint-order: stroke fill;
        background-color: transparent;
        --menu-btn-border: clamp(16px, 3vmin, 32px);
        border: var(--menu-btn-border) solid transparent;
        border-image: none;
        border-radius: 0;
        overflow: visible;
        box-shadow: none;
        cursor: pointer;
        position: relative;
        isolation: isolate;
        z-index: 0;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.28);
        filter: none;
        transform: translateZ(0);
        transition: transform 0.12s ease, filter 0.06s ease;
      }
      .menu.main-menu .menu-option:hover,
      .menu.main-menu .menu-option:focus-visible {
        filter: brightness(1.09);
        outline: none;
      }
      .menu.main-menu .menu-option:hover {
        transform: translateZ(0) scale(0.95);
      }
      .menu.main-menu .menu-option:active {

      .hud-frenzy-fill {
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: linear-gradient(90deg, #b8f07a 0%, #7dde4a 55%, #5ecf2e 100%);
        box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.18);

      .hud-frenzy-meter.is-active .hud-frenzy-label {

      .hud-frenzy-meter.is-active .hud-frenzy-track {
        border-color: #c8ff7a;
      }
      .hud-frenzy-meter.is-active .hud-frenzy-fill {
        /* Smooth per-frame drain — no eased lag behind the timer. */
        transition: none;
        background: linear-gradient(90deg, #d4ff8a 0%, #8eef52 50%, #62e034 100%);
      }
      .hud-ctrl {
        width: clamp(40px, 7vw, 48px);
        height: clamp(40px, 7vw, 48px);
        padding: 0;
        display: grid;
        place-items: center;
        border: 3px solid #fff;
        border-radius: 12px;
        background: rgba(18, 28, 42, 0.78);
        color: #fff;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
        cursor: pointer;
        pointer-events: auto;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        transition: transform 0.12s ease, background 0.12s ease;
      }
      .hud-ctrl:hover,
      .hud-ctrl:focus-visible {
        background: rgba(32, 52, 78, 0.92);

      }
      .hud-ctrl:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
      }
      .hud-ctrl svg {
        width: 54%;
        height: 54%;
        fill: currentColor;
        display: block;
        pointer-events: none;
      }
      .hud-ctrl.is-muted {
        color: #ffb4b4;
      }
      /* Dims the stage behind pause menu + pause/mute controls */
      .hud-pause-overlay {
        position: absolute;
        inset: 0;
        z-index: 40;
        background: rgba(0, 0, 0, 0.45);
        pointer-events: auto;
      }
      .hud-pause-overlay[hidden] { display: none !important; }
      .hud-pause-menu,
      .hud-pause-confirm,
      .hud-pause-options {
        position: absolute;
        left: 50%;
        top: 46%;
        transform: translate(-50%, -50%);
        z-index: 41;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        width: min(400px, 90vw);
        max-height: min(82vh, 720px);
        overflow-x: hidden;
        overflow-y: auto;
        pointer-events: auto;
        user-select: none;
      }
      .hud-pause-menu[hidden],
      .hud-pause-confirm[hidden],
      .hud-pause-options[hidden] { display: none !important; }
      .hud-pause-menu-title {
        font: 800 clamp(36px, 8vw, 64px)/1 'Baloo 2', 'Fredoka', sans-serif;
        letter-spacing: 0.12em;
        color: #fff;
        -webkit-text-stroke: 4px #1a1018;
        paint-order: stroke fill;
        text-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
        animation: pausePulse 1.4s ease-in-out infinite;
      }
      @keyframes pausePulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.04); opacity: 0.85; }
      }
      .hud-pause-nav,
      .hud-pause-confirm-actions,
      .pause-options-sheet .main-menu-nav {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        width: 100%;
      }
      .hud-pause-confirm-copy {
        margin: 0;
        text-align: center;
        font: 800 clamp(18px, 3.2vw, 24px) / 1.35 'Baloo 2', 'Fredoka', sans-serif;
        letter-spacing: 0.02em;
        color: #fff;
        -webkit-text-stroke: 3px #1a1018;
        paint-order: stroke fill;
        text-shadow: 0 3px 0 rgba(0, 0, 0, 0.28);
      }
      .pause-options-host,
      .pause-options-sheet {
        width: 100%;
      }

      .hud-dock {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 8px;
        padding: 0 0 max(18px, env(safe-area-inset-bottom, 0px));
        z-index: 12;
        pointer-events: none;
      }
      .hud-left,
      .hud-right,
      .hud-center {
        display: flex;
        flex-direction: column;
        position: relative;
      }
      .hud-left {
        align-items: flex-start;
        flex: 0 0 auto;
        /* Push flat edge further off-screen so clipped shadows aren't visible */
        transform: translateX(-14px);
      }
      .hud-right {
        align-items: flex-end;
        flex: 0 0 auto;
        transform: translateX(14px);
      }
      .hud-center {
        align-items: center;
        flex: 1 1 auto;
        min-width: 0;
      }

      .hud-panel {
        position: relative;
        background-repeat: no-repeat;
        background-size: 100% 100%;
        image-rendering: auto;
      }

      /* Panel title labels (separate from baked-in art) */
      .hud-panel-label {
        position: absolute;
        z-index: 1;
        font: 800 clamp(14px, 2.2vw, 24px)/1 'Baloo 2', 'Fredoka', sans-serif;
        letter-spacing: 0.04em;
        pointer-events: none;
        user-select: none;
        white-space: nowrap;
        paint-order: stroke fill;
      }
      .hud-score-label {
        left: 14.8%;
        top: 6.5%;
        color: #1a1018;
        -webkit-text-stroke: 0;
        text-shadow:
          -2px -2px 0 #fff,
           0px -2px 0 #fff,
           2px -2px 0 #fff,
          -2px  0px 0 #fff,
           2px  0px 0 #fff,
          -2px  2px 0 #fff,
           0px  2px 0 #fff,
           2px  2px 0 #fff;
      }
      .hud-ammo-label {
        left: 50%;
        top: 6.5%;
        transform: translateX(-50%);
        color: #1a1018;
        -webkit-text-stroke: 0;
        text-shadow:
          -2px -2px 0 #fff,
           0px -2px 0 #fff,
           2px -2px 0 #fff,
          -2px  0px 0 #fff,
           2px  0px 0 #fff,
          -2px  2px 0 #fff,
           0px  2px 0 #fff,
           2px  2px 0 #fff;
      }
      .hud-time-label {
        right: 19%;
        top: 6.5%;
        color: #1a1018;
        -webkit-text-stroke: 0;
        text-shadow:
          -2px -2px 0 #fff,
           0px -2px 0 #fff,
           2px -2px 0 #fff,
          -2px  0px 0 #fff,
           2px  0px 0 #fff,
          -2px  2px 0 #fff,
           0px  2px 0 #fff,
           2px  2px 0 #fff;
      }
      .hud-lives-label {
        right: 16%;
        top: 6.5%;
        color: #1a1018;
        -webkit-text-stroke: 0;
        text-shadow:
          -2px -2px 0 #fff,
           0px -2px 0 #fff,
           2px -2px 0 #fff,
          -2px  0px 0 #fff,
           2px  0px 0 #fff,
          -2px  2px 0 #fff,
           0px  2px 0 #fff,
           2px  2px 0 #fff;
      }

      /* SCORE — flush left edge of screen */
      .hud-score {
        width: clamp(150px, 21vw, 270px);
        height: clamp(54px, 7.5vw, 98px);
        background-image: url('/assets/hud/score.png');
        display: block;
      }
      .hud-score-num {
        position: absolute;
        right: clamp(14px, 2.25vw, 27px);
        /*
          Center in the light face of the lower body only:
          nudge floor ~34% → face/bevel seam ~90%. Flex-centers for equal gaps.
        */
        top: 34%;
        bottom: 10%;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        box-sizing: border-box;
        font: 800 clamp(26px, 4.2vw, 44px)/1 'Baloo 2', 'Fredoka', sans-serif;
        color: #fff;
        -webkit-text-stroke: 3px #1a1018;
        paint-order: stroke fill;
        letter-spacing: 0.02em;
        line-height: 1;
      }

      /* COMBO ribbon — above score, with 4-hit buildup pips */
      .hud-combo {
        position: absolute;
        left: clamp(6px, 1.1vw, 15px);
        bottom: calc(100% + 32px);
        width: clamp(82px, 12vw, 150px);
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 4px;
        transform: rotate(-3deg) scale(1.2);
        transform-origin: left bottom;
        z-index: 2;
      }
      .hud-combo[hidden] { display: none !important; }
      .hud-combo-badge {
        height: clamp(27px, 3.75vw, 44px);
        background: url('/assets/hud/combo.png') center / 100% 100% no-repeat;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 6px 3px;
      }
      .hud-combo-text {
        font: 800 italic clamp(11px, 1.65vw, 17px)/1 'Baloo 2', 'Fredoka', sans-serif;
        letter-spacing: 0.04em;
        white-space: nowrap;
        color: #fff;
        -webkit-text-fill-color: #fff;
        -webkit-text-stroke: 1.875px #1a1018;
        paint-order: stroke fill;
      }
      .hud-combo-track {
        display: flex;
        gap: 3px;
        height: clamp(7px, 1.05vw, 10px);
        padding: 0 12% 0 6%;
      }
      .hud-combo-pip {
        flex: 1;
        min-width: 0;
        border: 2px solid #fff;
        border-radius: 3px;
        background: rgba(18, 28, 42, 0.72);
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
        transition: background 0.12s ease;
      }
      .hud-combo-pip.filled {
        background: linear-gradient(180deg, #ffe566 0%, #ffb300 100%);
      }
      .hud-combo.max .hud-combo-pip.filled {
        background: linear-gradient(180deg, #ff8a80 0%, #ff1744 100%);
      }
      .hud-combo.pop { animation: comboPop 0.35s cubic-bezier(0.2, 1.4, 0.4, 1); }
      @keyframes comboPop {
        0% { transform: rotate(-3deg) scale(0.84); }
        60% { transform: rotate(-3deg) scale(1.344); }
        100% { transform: rotate(-3deg) scale(1.2); }
      }
      .hud-combo.break {
        transform-origin: left center;
        animation: comboBreak 0.32s ease-in forwards;
        pointer-events: none;
      }
      @keyframes comboBreak {
        from { transform: rotate(-3deg) scale(1.2); }
        to { transform: rotate(-3deg) scale(0); }
      }

      /* AMMO — centered; tap/click to reload */
      .hud-ammo {
        width: min(390px, 42vw);
        height: clamp(52px, 7.1vw, 90px);
        background-image: url('/assets/hud/ammo.png');
        /* Icons are absolutely placed so the AMMO label cannot skew centering */
        display: block;
        overflow: hidden;
        box-sizing: border-box;
        pointer-events: auto;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        transition: transform 0.12s ease, filter 0.12s ease;
      }
      .hud-ammo:hover,
      .hud-ammo:focus-visible {
        filter: brightness(1.06);
        outline: none;
      }
      .hud-ammo:active {
        transform: scale(0.985);
      }
      .hud-ammo-icons {
        position: absolute;
        left: 8%;
        right: 8%;
        bottom: clamp(10px, 1.4vw, 18px);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(6px, 1.1vw, 14px);
        min-height: 0;
        margin: 0;
        pointer-events: none;
      }
      .hud-tooth {
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        width: clamp(22px, 3.4vw, 36px);
        height: clamp(22px, 3.4vw, 36px);
        aspect-ratio: 1;
        transition: transform 0.15s ease, opacity 0.15s ease, filter 0.15s ease;
      }
      .hud-tooth-icon {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        pointer-events: none;
        user-select: none;
      }
      .hud-tooth.empty {
        opacity: 0.22;
        filter: grayscale(0.85) brightness(1.15);
        transform: scale(0.86);
      }
      .hud-tooth.pop-in { animation: toothPop 0.32s cubic-bezier(0.2, 1.5, 0.4, 1); }
      @keyframes toothPop {
        0% { transform: scale(0.2); opacity: 0; }
        55% { transform: scale(1.22); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }
      .hud-ammo.flash { animation: blink 0.08s linear 3; }
      @keyframes blink { 50% { opacity: 0.3; } }

      /* TIME — flush right edge of screen */
      .hud-time {
        width: clamp(165px, 23vw, 290px);
        height: clamp(54px, 7.5vw, 98px);
        background-image: url('/assets/hud/time.png');
        display: block;
      }
      .hud-time-value {
        position: absolute;
        left: clamp(12px, 2vw, 24px);
        /*
          Center in the light face of the lower body only:
          nudge floor ~34% → face/bevel seam ~90%. Flex-centers for equal gaps.
        */
        top: 34%;
        bottom: 10%;
        display: flex;
        align-items: center;
        gap: 0;
        box-sizing: border-box;
        color: #fff;
        -webkit-text-stroke: 3px #1a1018;
        paint-order: stroke fill;
        line-height: 1;
      }
      .hud-time-sec {
        font: 800 clamp(22px, 3.6vw, 40px)/1 'Baloo 2', 'Fredoka', sans-serif;
      }
      .hud-time-dot,
      .hud-time-ms {
        font: 800 clamp(15px, 2.4vw, 25px)/1 'Baloo 2', 'Fredoka', sans-serif;
      }
      .hud-time.finale .hud-time-value {
        color: #ffe566;
      }
      .hud-time.finale:not(.critical) {
        animation: finalePulse 0.72s ease-in-out infinite;
      }
      @keyframes finalePulse {
        0%, 100% { filter: brightness(1); }
        50% { filter: brightness(1.28) saturate(1.2); }
      }
      .hud-time.critical {
        animation: criticalPulse 0.6s ease-in-out infinite;
      }
      @keyframes criticalPulse {
        0%, 100% { filter: brightness(1); }
        50% { filter: brightness(1.18); }
      }

      /* LIVES (endless) — flush right */
      .hud-lives {
        width: clamp(150px, 21vw, 270px);
        height: clamp(54px, 7.5vw, 98px);
        background-image: url('/assets/hud/lives.png');
        display: block;
      }
      .hud-lives-value {
        position: absolute;
        left: clamp(14px, 2.25vw, 27px);
        /* Match score/time: center in light lower body below the LIVES nudge */
        top: 34%;
        bottom: 10%;
        display: flex;
        align-items: center;
        gap: clamp(2px, 0.4vw, 6px);
        box-sizing: border-box;
        line-height: 1;
      }
      .hud-heart {
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        width: clamp(22px, 3.4vw, 34px);
        height: clamp(22px, 3.4vw, 34px);
      }
      .hud-heart-icon {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        pointer-events: none;
        user-select: none;
      }
      .hud-heart-zero {
        font: 800 clamp(22px, 3.6vw, 40px)/1 'Baloo 2', 'Fredoka', sans-serif;
        color: #fff;
        -webkit-text-stroke: 3px #1a1018;
        paint-order: stroke fill;
      }
      .hud-lives.critical { animation: criticalPulse 0.6s ease-in-out infinite; }

      .hud-reload-hint {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 48px;
        font-weight: 700;
        color: #ff4444;
        text-shadow: 0 0 6px #000, 3px 3px 0 #000;
        animation: reloadFlash 0.55s ease-in-out infinite;
        z-index: 15;
        pointer-events: none;
      }
      .hud-reload-hint[hidden] {
        display: none !important;
        animation: none;
      }
      @keyframes reloadFlash {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }

      body.playing { cursor: none; }
      html.touch-ui body.playing { cursor: default; }
      .crosshair {
        position: fixed;
        top: 0; left: 0;
        width: 56px;
        height: 56px;
        border: none;
        border-radius: 0;
        pointer-events: none;
        box-shadow: none;
        background: url('/assets/reticle.png') center / contain no-repeat;
        transform: translate(var(--x, 0px), var(--y, 0px)) translate(-50%, -50%);
      }
      html.touch-ui .crosshair { display: none; }
      .crosshair::before, .crosshair::after { content: none; }
      .crosshair.kick {
        animation: crosshairKick 0.16s ease-out;
      }
      @keyframes crosshairKick {
        0% { transform: translate(var(--x, 0px), var(--y, 0px)) translate(-50%, -50%) scale(1); }
        35% { transform: translate(var(--x, 0px), var(--y, 0px)) translate(-50%, -50%) scale(0.5); }
        100% { transform: translate(var(--x, 0px), var(--y, 0px)) translate(-50%, -50%) scale(1); }
      }
      .crumb {
        position: fixed;
        width: var(--s, 16px);
        height: var(--s, 14px);
        margin: 0;
        left: 0;
        top: 0;
        border-radius: 40% 55% 45% 60%;
        pointer-events: none;
        z-index: 18;
        background: var(--c, #d8b07a);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25);
        opacity: 1;
        transform: translate(-50%, -50%) translate(0, 0) rotate(0deg);
        animation: crumbFall var(--dur, 0.7s) cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
      }
      @keyframes crumbFall {
        0% {
          opacity: 1;
          transform: translate(-50%, -50%) translate(0, 0) rotate(0deg) scale(1);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -50%)
            translate(var(--dx, 0px), var(--dy, 120px))
            rotate(var(--rot, 180deg))
            scale(0.55);
        }
      }
      .bubble-pop-flash {
        position: fixed;
        left: 0;
        top: 0;
        width: 34px;
        height: 34px;
        margin: 0;
        border-radius: 50%;
        pointer-events: none;
        z-index: 40;
        background: radial-gradient(circle, #fff 0%, #7ad7ff 45%, transparent 72%);
        transform: translate(-50%, -50%) scale(0.4);
        animation: bubblePopFlash 0.26s ease-out forwards;
      }
      @keyframes bubblePopFlash {
        0% { opacity: 1; transform: translate(-50%, -50%) scale(0.4); }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(2.8); }
      }
      .bubble-pop-ring {
        position: fixed;
        left: 0;
        top: 0;
        width: 28px;
        height: 28px;
        margin: 0;
        border-radius: 50%;
        border: 3px solid #ff4d8d;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.85), 0 0 14px rgba(46, 199, 255, 0.9);
        pointer-events: none;
        z-index: 40;
        transform: translate(-50%, -50%) scale(0.3);
        animation: bubblePopRing 0.45s cubic-bezier(0.15, 0.75, 0.35, 1) forwards;
      }
      @keyframes bubblePopRing {
        0% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(0.3);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(4.2);
        }
      }
      .bubble-pop {
        position: fixed;
        width: var(--s, 14px);
        height: var(--s, 14px);
        margin: 0;
        left: 0;
        top: 0;
        border-radius: 50%;
        pointer-events: none;
        z-index: 40;
        background: var(--c, #2ec7ff);
        box-shadow: 0 0 0 2px #fff, 0 2px 0 #000;
        opacity: 1;
        transform: translate(-50%, -50%) translate(0, 0) scale(1);
        animation: bubblePopBurst var(--dur, 0.55s) cubic-bezier(0.12, 0.7, 0.28, 1) forwards;
      }
      @keyframes bubblePopBurst {
        0% {
          opacity: 1;
          transform: translate(-50%, -50%) translate(0, 0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -50%)
            translate(var(--dx, 0px), var(--dy, 0px))
            scale(0.35);
        }
      }
      .floater {
        position: fixed;
        transform: translate(-50%, -50%);
        font-size: 28px;
        font-weight: 700;
        text-shadow: 0 2px 0 #000, 0 0 6px #000;
        pointer-events: none;
        transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.7s ease;
        opacity: 1;
        z-index: 20;
      }
      .floater.go {
        transform: translate(-50%, calc(-50% - 60px));
        opacity: 0;
      }

      /* Tutorial dialogue — lower-third GUI (teeth portrait + speech bubble). */
      .tut-coach {
        position: absolute;
        inset: 0;
        z-index: 26;
        pointer-events: none;
        text-align: left;
      }
      .tut-dialogue {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 32%;
        min-height: 168px;
        max-height: 280px;
        display: flex;
        align-items: stretch;
        gap: 0;
        padding: 0 max(10px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px));
        pointer-events: none;
        animation: tutDialogueIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes tutDialogueIn {
        from { transform: translateY(28px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      html:not(.touch-ui) .tut-dialogue {
        height: 36%;
        max-height: 300px;
      }
      html:not(.touch-ui) .tut-bubble {
        margin-bottom: clamp(62px, 9.5vw, 104px);
      }
      .tut-speaker {
        flex: 0 0 auto;
        width: clamp(168px, 26vw, 280px);
        height: 125%;
        margin-bottom: -10px;
        margin-right: -12px;
        position: relative;
        overflow: hidden;
        pointer-events: auto;
        filter: drop-shadow(0 10px 16px rgba(0, 0, 0, 0.5));
        z-index: 3;
      }
      .tut-speaker-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .tut-bubble {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
        align-self: center;
        box-sizing: border-box;

      html.touch-ui .tut-speaker { width: clamp(110px, 24vw, 180px); }
      html.touch-ui .tut-title { font-size: clamp(16px, 4.2vh, 22px); }
      html.touch-ui .tut-body { font-size: 14px; min-height: 2.4em; }
      html.touch-ui .tut-btn.tut-back,
      html.touch-ui .tut-btn.tut-next { font-size: 16px; padding: 8px 12px; }
      html.touch-ui .tut-arrow { width: 40px; height: 50px; }

      /* Short landscape phones — keep game-over + tutorial fully on screen. */
      @media (orientation: landscape) and (max-height: 520px) {
        html.touch-ui .menu.game-over .menu-card {
          padding: 10px 14px 12px;
          width: min(460px, 100%);
        }
        html.touch-ui .menu.game-over h1 {
          font-size: clamp(20px, 6vh, 26px);
          margin-bottom: 0;
          text-align: center;
        }
        html.touch-ui .menu.game-over .muted {
          margin-bottom: 4px;
          font-size: 13px;
          text-align: center;
        }
        html.touch-ui .run-tally { margin: 6px auto 4px; }
        html.touch-ui .tally-row { font-size: 13px; line-height: 1.3; }
        html.touch-ui .tally-row.tally-total {
          font-size: 20px;
          margin-top: 4px;
          padding-top: 4px;
        }
        html.touch-ui .name-step { display: none; }
        html.touch-ui .name-initials { margin: 6px auto 4px; gap: 10px; }
        html.touch-ui .name-letter { width: 44px; height: 48px; font-size: 26px; }
        html.touch-ui .status { min-height: 16px; font-size: 13px; margin-bottom: 4px; }
        html.touch-ui .btn-row {
          width: 100%;
          margin-top: 4px;
          gap: 8px;
        }
        html.touch-ui .btn-row .btn {
          width: auto;
          flex: 1 1 0;
          min-width: 0;
          padding: 8px 10px;
          font-size: 16px;
        }
        html.touch-ui .btn.muted-btn {
          margin-top: 8px;
          max-width: 140px;
          padding: 8px 10px;
          font-size: 16px;
        }
        html.touch-ui .tut-dialogue {
          height: 42%;
          min-height: 120px;
          max-height: 180px;
        }
        html.touch-ui .tut-speaker { width: clamp(88px, 18vw, 140px); }
        html.touch-ui .tut-bubble { padding: 6px 12px 8px 14px; border-radius: 16px; }
        html.touch-ui .tut-title { font-size: 15px; }
        html.touch-ui .tut-body { font-size: 13px; min-height: 1.8em; }
        html.touch-ui .tut-nav { margin-top: 6px; gap: 8px; }
        html.touch-ui .tut-btn.tut-back,
        html.touch-ui .tut-btn.tut-next { font-size: 14px; padding: 6px 10px; }
        html.touch-ui .hud-mobile-stats { gap: 0.2em 0.7em; }
        html.touch-ui .hud-m-stat,
        html.touch-ui .hud-combo { font-size: clamp(12px, 3.2vh, 16px); }
        html.touch-ui .hud-frenzy-meter {
          top: calc(env(safe-area-inset-top, 0px) + 38px);
          width: min(160px, 34vw);
        }
      }

      /* Boot/Loading screen */
      .boot-screen {
        position: absolute;
        inset: 0;
        background: #000;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: max(48px, env(safe-area-inset-bottom, 0px));
        pointer-events: auto;
        z-index: 100;
      }
      .boot-loader {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .boot-bubble {
        width: 48px;
        height: 48px;
        background: url('/assets/bubble-loading.png') center / contain no-repeat;
        animation: bootBubbleSpin 1.2s linear infinite;
      }
      @keyframes bootBubbleSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .boot-text {
        display: flex;
        align-items: baseline;
        font: 700 clamp(18px, 4vw, 28px) / 1 'Fredoka', system-ui, sans-serif;
        letter-spacing: 0.18em;
        color: #fff;
      }
      .boot-loading {
        color: #fff;
      }
      .boot-dots {
        display: inline-flex;
      }
      .boot-dot {
        opacity: 0;
      }
      .boot-dot:nth-child(1) {
        animation: bootDot1 1.8s linear infinite;
      }
      .boot-dot:nth-child(2) {
        animation: bootDot2 1.8s linear infinite;
      }
      .boot-dot:nth-child(3) {
        animation: bootDot3 1.8s linear infinite;
      }
      .hud.hud-intro-off .hud-score,
      .hud.hud-intro-off .hud-ammo,
      .hud.hud-intro-off .hud-time,
      .hud.hud-intro-off .hud-lives,
      html.touch-ui .hud.hud-intro-off .hud-score,
      html.touch-ui .hud.hud-intro-off .hud-ammo,
      html.touch-ui .hud.hud-intro-off .hud-time,
      html.touch-ui .hud.hud-intro-off .hud-lives {
        transition: none;
      }
      .hud.hud-intro-off .hud-score,
      html.touch-ui .hud.hud-intro-off .hud-score {
        transform: translate3d(-120vw, 0, 0);
      }
      .hud.hud-intro-off .hud-ammo {
        transform: translate3d(0, 120vh, 0);
      }
      html.touch-ui .hud.hud-intro-off .hud-ammo {
        transform: translate3d(0, -120vh, 0);
      }
      .hud.hud-intro-off .hud-time,
      .hud.hud-intro-off .hud-lives,
      html.touch-ui .hud.hud-intro-off .hud-time,
      html.touch-ui .hud.hud-intro-off .hud-lives {
        transform: translate3d(120vw, 0, 0);
      }
      .hud.hud-intro-in .hud-score,
      .hud.hud-intro-in .hud-ammo,
      .hud.hud-intro-in .hud-time,
      .hud.hud-intro-in .hud-lives,
      html.touch-ui .hud.hud-intro-in .hud-score,
      html.touch-ui .hud.hud-intro-in .hud-ammo,
      html.touch-ui .hud.hud-intro-in .hud-time,
      html.touch-ui .hud.hud-intro-in .hud-lives {
        transform: none;
        transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      }

      @keyframes bootDot1 {
        0%, 16.66% { opacity: 0; }
        16.67% { opacity: 1; }
        74.99% { opacity: 1; }
        75% { opacity: 0; }
        100% { opacity: 0; }
      }
      @keyframes bootDot2 {
        0%, 33.32% { opacity: 0; }
        33.33% { opacity: 1; }
        74.99% { opacity: 1; }
        75% { opacity: 0; }
        100% { opacity: 0; }
      }
      @keyframes bootDot3 {
        0%, 49.99% { opacity: 0; }
        50% { opacity: 1; }
        74.99% { opacity: 1; }
        75% { opacity: 0; }
        100% { opacity: 0; }
      }

      /*
        Results overlay (tally / initials / post-run leaderboard): the panel is 75% of
        the viewport, and type + controls scale from the panel via container units.
      */
      :is(html, html.touch-ui) :is(.menu.bonus-tally, .menu.game-over),
      :is(html, html.touch-ui) body.results-crash-on .menu.leaderboard {
        justify-content: center;
        align-items: center;
        overflow: hidden;
        touch-action: none;
      }
      :is(html, html.touch-ui) :is(.menu.bonus-tally, .menu.game-over) .menu-card,
      :is(html, html.touch-ui) body.results-crash-on .menu.leaderboard .menu-wide {
        --gold: #fff70f;
        width: 75vw;
        height: 75vh;
        max-width: 75vw;
        max-height: 75vh;
        margin-block: 0;
        padding: 3.2cqh 4.2cqi;
        box-sizing: border-box;
        background: none;
        border: none;
        border-radius: 0;
        box-shadow: none;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        container-type: size;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: stretch;
        overflow: auto;
        font-size: 4.2cqh;
        color: #f7f7f7;
      }
      :is(html, html.touch-ui) :is(.menu.bonus-tally, .menu.game-over) .menu-card h1,
      :is(html, html.touch-ui) :is(.menu.bonus-tally, .menu.game-over) .muted,
      :is(html, html.touch-ui) :is(.menu.bonus-tally, .menu.game-over) .score-big,
      :is(html, html.touch-ui) .menu.bonus-tally .tally-row,
      :is(html, html.touch-ui) .menu.game-over .go-form,
      :is(html, html.touch-ui) .menu.game-over .status,
      :is(html, html.touch-ui) body.results-crash-on .menu.leaderboard .menu-wide h1,
      :is(html, html.touch-ui) body.results-crash-on .menu.leaderboard .muted,
      :is(html, html.touch-ui) body.results-crash-on .menu.leaderboard .lb-run,
      :is(html, html.touch-ui) body.results-crash-on .menu.leaderboard .lb-row {
        -webkit-text-stroke: 0.56cqh #1a1018;
        paint-order: stroke fill;
        text-shadow: 0 0.28cqh 0 rgba(0, 0, 0, 0.4);
      }
      :is(html, html.touch-ui) :is(.menu.bonus-tally, .menu.game-over) .muted,
      :is(html, html.touch-ui) .menu.bonus-tally .tally-row,
      :is(html, html.touch-ui) .menu.bonus-tally .tally-row.is-missed,
      :is(html, html.touch-ui) .menu.bonus-tally .tally-row-active .tally-value,
      :is(html, html.touch-ui) body.results-crash-on .menu.leaderboard .muted {
        color: #f7f7f7;
      }
      :is(html, html.touch-ui) .menu.game-over .score-big,
      :is(html, html.touch-ui) .menu.bonus-tally .tally-row.is-earned,
      :is(html, html.touch-ui) .menu.bonus-tally .tally-row.tally-total {
        color: #fff70f;
      }
      :is(html, html.touch-ui) :is(.menu.bonus-tally, .menu.game-over) .menu-card h1,
      :is(html, html.touch-ui) body.results-crash-on .menu.leaderboard .menu-wide h1 {
        font-size: 8.5cqh;
        margin-bottom: 1.2cqh;
      }
      :is(html, html.touch-ui) :is(.menu.bonus-tally, .menu.game-over) .muted,
      :is(html, html.touch-ui) body.results-crash-on .menu.leaderboard .muted {
        font-size: 3.6cqh;
        margin-bottom: 2.4cqh;
      }
      :is(html, html.touch-ui) .menu.game-over .score-big {
        font-size: 7.2cqh;
        margin: 1.4cqh 0 2.2cqh;
      }
      :is(html, html.touch-ui) .menu.bonus-tally .run-tally {
        width: 88%;
        max-width: none;
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;
        margin: 1cqh auto;
        overflow: visible;
      }
      :is(html, html.touch-ui) .menu.bonus-tally .tally-value-wrap {
        display: inline-block;
      }
      :is(html, html.touch-ui) .menu.bonus-tally .tally-info {
        margin-left: 0.55em;
      }
      :is(html, html.touch-ui) .menu.bonus-tally .tally-row {
        font-size: 5.6cqh;
        line-height: 1.35;
        gap: 2.4cqi;
      }
      :is(html, html.touch-ui) .menu.bonus-tally .tally-row.tally-total {
        font-size: 8.4cqh;
        margin-top: 1.8cqh;
        padding-top: 1.8cqh;
        border-top: 4px solid #f7f7f7;
      }
      :is(html, html.touch-ui) .menu.bonus-tally .tally-info-btn {
        width: 4.8cqh;
        height: 4.8cqh;
        font-size: 3cqh;
      }
      :is(html, html.touch-ui) .menu.bonus-tally .tally-info-bubble {
        width: min(52cqi, 90%);
        padding: 1.6cqh 2cqi;
      }
      :is(html, html.touch-ui) .menu.bonus-tally .tally-info-title {
        font-size: 2.8cqh;
      }
      :is(html, html.touch-ui) .menu.bonus-tally .tally-info-list {

      :is(html, html.touch-ui) :is(.menu.bonus-tally, .menu.game-over) .btn,
      :is(html, html.touch-ui) body.results-crash-on .menu.leaderboard .btn {
        max-width: 55cqi;
        padding: 2cqh 3.2cqi;
        font-size: 5.4cqh;

        border-width: max(2px, 0.45cqh);

      :is(html, html.touch-ui) :is(.menu.bonus-tally, .menu.game-over) .btn-row {

      }
      :is(html, html.touch-ui) :is(.menu.bonus-tally, .menu.game-over) .btn-row .btn {

      :is(html, html.touch-ui) body.results-crash-on .menu.leaderboard .lb-run,
      :is(html, html.touch-ui) body.results-crash-on .menu.leaderboard .lb-panel {
        width: 100%;
        max-width: none;
      }
      :is(html, html.touch-ui) body.results-crash-on .menu.leaderboard .lb-run-score {
        font-size: 5.2cqh;
      }
      :is(html, html.touch-ui) body.results-crash-on .menu.leaderboard .lb-run-detail {
        font-size: 3cqh;
      }
      :is(html, html.touch-ui) body.results-crash-on .menu.leaderboard .lb-header {
        font-size: 2.6cqh;
      }
      :is(html, html.touch-ui) body.results-crash-on .menu.leaderboard .lb-row {

      :is(html, html.touch-ui) body.results-crash-on .menu.leaderboard .lb-panel {

      :is(html, html.touch-ui) body.results-crash-on .menu.leaderboard .btn.muted-btn {
        max-width: 36cqi;
      }
    </style>
