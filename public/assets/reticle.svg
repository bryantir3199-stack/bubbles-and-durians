<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Chattering teeth reticle: white line art, transparent background -->
  <defs>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#000" flood-opacity="0.9"/>
    </filter>
  </defs>
  <g filter="url(#ink)"
     transform="translate(64 66) rotate(-22) translate(-64 -66)"
     stroke="#fff"
     stroke-width="5"
     stroke-linecap="round"
     stroke-linejoin="round">
    <!-- Upper denture gum -->
    <path d="
      M22 50
      C24 26, 44 16, 64 16
      C84 16, 104 26, 106 50
      C100 42, 86 38, 72 38
      C58 38, 42 40, 34 48
      C30 50, 26 50, 22 50
      Z"/>
    <!-- Lower denture gum -->
    <path d="
      M24 86
      C26 108, 44 118, 64 118
      C84 118, 102 108, 104 86
      C98 94, 86 98, 72 98
      C58 98, 44 96, 36 88
      C32 86, 28 86, 24 86
      Z"/>

    <!-- Upper teeth (4), gaping open -->
    <rect x="30" y="48" width="13" height="17" rx="3.5"/>
    <rect x="46" y="46" width="13" height="19" rx="3.5"/>
    <rect x="62" y="45" width="13" height="20" rx="3.5"/>
    <rect x="78" y="47" width="13" height="18" rx="3.5"/>

    <!-- Lower teeth (4) -->
    <rect x="30" y="69" width="13" height="17" rx="3.5"/>
    <rect x="46" y="67" width="13" height="19" rx="3.5"/>
    <rect x="62" y="66" width="13" height="20" rx="3.5"/>
    <rect x="78" y="68" width="13" height="18" rx="3.5"/>
  </g>
</svg>
